openapi: 3.1.0
info:
  title: orders-api
  version: 4.12.0
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: the order
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string, enum: [placed, picking, shipped, cancelled] }
                  placedAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
                  channel: { type: string }
                  customerId: { type: string }
                  customerTier: { type: string }
                  warehouseCode: { type: string }
                  carrierHint: { type: string }
                  pickWaveId: { type: string, nullable: true }
                  subtotalCents: { type: integer }
                  taxCents: { type: integer }
                  shippingCents: { type: integer }
                  totalCents: { type: integer }
                  currency: { type: string }
                  internalRiskScore: { type: number }
                  fraudReviewState: { type: string }
                  notesInternal: { type: string, nullable: true }
                  lines:
                    type: array
                    items:
                      type: object
                      properties:
                        sku: { type: string }
                        qty: { type: integer }
                        unitPriceCents: { type: integer }
                        pickBin: { type: string }
                        lotCode: { type: string, nullable: true }
              example:
                id: "ord_7741"
                status: "picking"
                placedAt: "2026-09-01T10:04:00Z"
                updatedAt: "2026-09-01T11:20:00Z"
                channel: "web"
                customerId: "cus_311"
                customerTier: "gold"
                warehouseCode: "LAX-2"
                carrierHint: "ups_ground"
                pickWaveId: null
                subtotalCents: 12000
                taxCents: 840
                shippingCents: 599
                totalCents: 13439
                currency: "USD"
                internalRiskScore: 0.08
                fraudReviewState: "clear"
                notesInternal: null
                lines:
                  - sku: "AER-B2-GR"
                    qty: 1
                    unitPriceCents: 12000
                    pickBin: "A-14-3"
                    lotCode: null
