name: integration
on:
  pull_request:
  push:
    branches: [main]

jobs:
  it:
    runs-on: [self-hosted, linux, x64]
    env:
      TESTCONTAINERS_REUSE_ENABLE: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: ./mvnw -B verify
