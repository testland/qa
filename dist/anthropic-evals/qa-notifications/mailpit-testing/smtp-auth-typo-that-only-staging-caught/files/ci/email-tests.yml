name: email

on: [push, pull_request]

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: docker compose -f docker-compose.test.yml up -d mail
      - run: npm run app:start &
      - run: node --test test/
