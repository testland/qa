openapi: 3.0.3
info:
  title: Orillo Commerce API
  version: 4.1.0
paths:
  /v1/sessions:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '200':
          description: token
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
        '401': { description: rejected }
  /v1/carts:
    post:
      operationId: createCart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currency]
              properties:
                currency: { type: string, minLength: 3, maxLength: 3 }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [id, currency, items]
                properties:
                  id: { type: string }
                  currency: { type: string }
                  items: { type: array, items: { type: object } }
        '422': { description: rejected }
  /v1/carts/{cart_id}:
    get:
      operationId: getCart
      parameters:
        - name: cart_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: cart
          content:
            application/json:
              schema:
                type: object
                required: [id, currency, items]
                properties:
                  id: { type: string }
                  currency: { type: string }
                  items: { type: array, items: { type: object } }
        '404': { description: unknown cart }
  /v1/carts/{cart_id}/items:
    post:
      operationId: addItem
      parameters:
        - name: cart_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, quantity]
              properties:
                sku: { type: string }
                quantity: { type: integer, minimum: 1, maximum: 99 }
      responses:
        '201': { description: added }
        '404': { description: unknown cart }
        '422': { description: rejected }
  /v1/orders:
    post:
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cart_id]
              properties:
                cart_id: { type: string }
      responses:
        '201':
          description: placed
          content:
            application/json:
              schema:
                type: object
                required: [id, status, total_cents]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [placed, paid, cancelled] }
                  total_cents: { type: integer }
        '404': { description: unknown cart }
        '422': { description: rejected }
  /v1/orders/{order_id}:
    get:
      operationId: getOrder
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: order
          content:
            application/json:
              schema:
                type: object
                required: [id, status, total_cents]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [placed, paid, cancelled] }
                  total_cents: { type: integer }
        '404': { description: unknown order }
