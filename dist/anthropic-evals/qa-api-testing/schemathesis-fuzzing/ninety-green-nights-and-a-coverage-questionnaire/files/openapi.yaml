paths:
  /v1/accounts:
    get:
      operationId: listAccounts
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '200':
          description: accounts
          content:
            application/json:
              schema:
                type: object
                required: [items, next]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Account' }
                  next: { type: string, nullable: true }
        '400': { description: bad request }
  /v1/accounts/{id}:
    get:
      operationId: getAccount
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '404': { description: unknown account }
  /v1/transfers:
    post:
      operationId: createTransfer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, amount_cents]
              properties:
                from: { type: string }
                to: { type: string }
                amount_cents: { type: integer, minimum: 1, maximum: 100000000 }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [pending, settled, failed] }
        '400': { description: rejected }
        '409': { description: duplicate }
  /v1/statements:
    get:
      operationId: listStatements
      parameters:
        - name: account_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: statements
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, period, total_cents]
                      properties:
                        id: { type: string }
                        period: { type: string }
                        total_cents: { type: integer }
        '400': { description: bad request }
  /v2/exports:
    get:
      operationId: listExports
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        '200':
          description: exports
          content:
            application/json:
              schema:
                type: object
  /v2/webhooks:
    post:
      operationId: registerWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
      responses:
        default:
          description: response
  /v2/mandates/{id}:
    delete:
      operationId: revokeMandate
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: revoked
components:
  schemas:
    Account:
      type: object
      required: [id, status, balance_cents]
      properties:
        id: { type: string }
        status: { type: string, enum: [active, frozen, closed] }
        balance_cents: { type: integer }
