name: api-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      API_TOKEN: "stg_xxxxxxxxxxxxxxxxxxxx"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run API tests
        run: mvn -q verify -Dapi.baseURI=https://api.acme.com
