name: tests

on: [push]

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LD_SDK_KEY: ${{ secrets.LD_SDK_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
