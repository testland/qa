version: 2
updates:
  - package-ecosystem: "pnpm"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/services/ranker"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "django*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
