version: 2

models:
  - name: stg_refunds
    columns:
      - name: refund_id
        data_tests:
          - unique
          - not_null
      - name: amount
        data_tests:
          - not_null

  - name: stg_payments
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: payment_intent_id
        data_tests:
          - not_null
