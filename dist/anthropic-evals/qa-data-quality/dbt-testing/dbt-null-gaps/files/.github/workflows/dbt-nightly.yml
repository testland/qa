name: dbt-nightly
on:
  schedule:
    - cron: '0 3 * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install dbt-postgres==1.10.*
      - run: dbt deps
      - run: dbt build --target prod
        env:
          DBT_PASSWORD: ${{ secrets.DBT_PASSWORD }}
