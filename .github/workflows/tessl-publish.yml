name: tessl-publish

# Publishes skills to the Tessl registry. On push, only skills whose SKILL.md,
# evals/, or .tessl-plugin manifest changed are (re)published, at their manifest
# version, so unchanged skills keep their aligned versions. Changing any of those
# therefore requires bumping .tessl-plugin/plugin.json, or the publish is rejected
# as a duplicate version and the job fails. workflow_dispatch republishes all, and
# there a duplicate version is the expected no-op rather than an error.
#
# Eval scenarios are NOT published by default: uploading them auto-starts a scored
# eval run per skill, which spends the org's Tessl credit allowance. Two exceptions:
# skills listed in .github/tessl-eval-skills.txt always publish with their evals,
# because the registry scores a skill by its latest version and one published
# without evals is capped at 0.8 x Quality; and a manual run with
# publish_evals=true uploads them for every skill it publishes.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**/.tessl-plugin/plugin.json'
      - 'plugins/**/SKILL.md'
      # Eval scenarios ship inside the skill directory and are what the registry
      # scores the skill against, so an evals-only edit must republish too.
      - 'plugins/**/evals/**'
      - '.github/workflows/tessl-publish.yml'
  workflow_dispatch:
    inputs:
      publish_evals:
        description: 'Upload eval scenarios and start a scored eval run (consumes Tessl credits)'
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Publish changed skills
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          PUBLISH_EVALS: ${{ inputs.publish_evals }}
          EVAL_LIST: .github/tessl-eval-skills.txt
        run: |
          set -uo pipefail
          # Publishing evals also auto-starts a scored eval run per skill, which spends the org's
          # Tessl credit allowance, so it stays opt-in: per skill via $EVAL_LIST, or for every
          # skill via workflow_dispatch.
          if [ "${PUBLISH_EVALS:-false}" = true ]; then
            echo "eval scenarios: published for every skill (eval runs will start)"
          else
            echo "eval scenarios: published only for skills listed in $EVAL_LIST"
          fi
          if [ -n "${BEFORE:-}" ] && git rev-parse --verify --quiet "${BEFORE}^{commit}" >/dev/null 2>&1; then
            mode=incremental
            mapfile -t dirs < <(git diff --name-only "$BEFORE" "$AFTER" \
              | grep -E '^plugins/[^/]+/skills/[^/]+/(SKILL\.md|\.tessl-plugin/plugin\.json|evals/.*)$' \
              | sed -E 's#^(plugins/[^/]+/skills/[^/]+)/.*#\1#' | sort -u)
            echo "Changed skill dirs: ${#dirs[@]}"
          else
            mode=full
            mapfile -t dirs < <(find plugins -type f -path '*/.tessl-plugin/plugin.json' \
              | sed -E 's#/\.tessl-plugin/plugin\.json$##' | sort -u)
            echo "Full publish: ${#dirs[@]} skills"
          fi
          count=0; skipped=0; failed=0
          : > /tmp/tessl-failures.txt
          for dir in "${dirs[@]}"; do
            { [ -n "$dir" ] && [ -f "$dir/.tessl-plugin/plugin.json" ]; } || continue
            eval_flag=--skip-evals; note=
            if [ "${PUBLISH_EVALS:-false}" = true ] || { [ -f "$EVAL_LIST" ] && grep -qxF "${dir##*/}" "$EVAL_LIST"; }; then
              eval_flag=; note=' with evals (a scored eval run will start)'
            fi
            echo "::group::Publishing $dir$note"
            if out=$(tessl skill publish "$dir" --workspace testland --public $eval_flag 2>&1); then
              echo "$out"; count=$((count + 1))
            elif printf '%s' "$out" | grep -qiE 'not available|already exists|already published'; then
              echo "$out"
              # Incremental mode only lists changed skills, so an unbumped version publishes nothing.
              if [ "$mode" = full ]; then
                echo "skip: version already published"; skipped=$((skipped + 1))
              else
                failed=$((failed + 1)); echo "$dir (version not bumped)" >> /tmp/tessl-failures.txt
                echo "::warning::$dir changed but .tessl-plugin/plugin.json version was not bumped"
              fi
            else
              echo "$out"; failed=$((failed + 1)); echo "$dir" >> /tmp/tessl-failures.txt
              echo "::warning::publish failed for $dir"
            fi
            echo "::endgroup::"
          done
          echo "Published $count; skipped $skipped; failed $failed"
          if [ "$failed" -gt 0 ]; then echo "::error::$failed skill(s) failed:"; cat /tmp/tessl-failures.txt; exit 1; fi
