name: tessl-publish

# Claims + publishes every skill that has a .tessl-plugin/plugin.json to the
# Tessl registry. The GitHub Action links this repo so previously-indexed
# copies are hidden/redirected instead of duplicated.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/**/.tessl-plugin/plugin.json'
      - 'plugins/**/SKILL.md'
      - '.github/workflows/tessl-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Publish claimed skills
        run: |
          set -uo pipefail
          count=0; failed=0
          : > /tmp/tessl-failures.txt
          while IFS= read -r manifest; do
            dir="$(dirname "$(dirname "$manifest")")"
            echo "::group::Publishing $dir"
            if tessl skill publish "$dir" --workspace testland --public --bump patch; then
              count=$((count + 1))
            else
              failed=$((failed + 1)); echo "$dir" >> /tmp/tessl-failures.txt
              echo "::warning::publish failed for $dir"
            fi
            echo "::endgroup::"
          done < <(find plugins -type f -path '*/.tessl-plugin/plugin.json' | sort)
          echo "Published $count skill(s); $failed failed"
          if [ "$failed" -gt 0 ]; then echo "::error::$failed skill(s) failed:"; cat /tmp/tessl-failures.txt; exit 1; fi
