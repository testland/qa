name: web-sync

# Tells testland/web to resync its plugin catalog (content/plugins/** and
# public/plugins-index.json) whenever a change to the plugins lands on main.
# testland/web's sync-plugins workflow does the sync, builds the site as a gate
# and pushes the result to its main, so testland.io shows the installable
# versions without a hand-made PR. Needs the WEB_SYNC_TOKEN secret: a
# fine-grained token with Contents read/write on testland/web only.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'CATALOG.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Ask testland/web to resync
        env:
          WEB_SYNC_TOKEN: ${{ secrets.WEB_SYNC_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$WEB_SYNC_TOKEN" ]; then
            echo "::error::WEB_SYNC_TOKEN is not set; add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${WEB_SYNC_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/testland/web/dispatches \
            -d "{\"event_type\":\"qa-updated\",\"client_payload\":{\"sha\":\"${SOURCE_SHA}\"}}"
          echo "Dispatched qa-updated for ${SOURCE_SHA::7}."
