name: tessl-archive-stale

# One-off: archives the Tessl tiles of skills that were merged or removed here
# but are still public on the registry, searchable and installable at their last
# version. The names are in .github/tessl-stale-tiles.txt. Archiving blocks new
# installs and keeps existing ones working
# (https://docs.tessl.io/reference/cli-commands, `tessl plugin archive`). Tessl
# documents no way to unarchive a plugin, so the default run is a dry run.
#
# Delete this workflow and the list once a real run has archived every tile.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "archive" to archive for real; anything else is a dry run'
        type: string
        default: ''

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: tesslio/setup-tessl@v2
        with:
          token: ${{ secrets.TESSL_TOKEN }}

      - name: Archive stale tiles
        env:
          CONFIRM: ${{ inputs.confirm }}
          REASON: 'Retired from testland/qa (merged into another skill or removed). Current skills: https://github.com/testland/qa/blob/main/CATALOG.md'
        run: |
          set -uo pipefail
          if [ "$CONFIRM" = archive ]; then echo "mode: archive"; else echo "mode: dry run"; fi
          total=0; archived=0; skipped=0; failed=0
          : > /tmp/archive-failures.txt
          while IFS= read -r name; do
            case "$name" in ''|'#'*) continue ;; esac
            total=$((total + 1))
            # Never archive a skill that is back in this repo.
            if compgen -G "plugins/*/skills/$name/SKILL.md" > /dev/null; then
              echo "::warning::skip $name: it exists in plugins/"; skipped=$((skipped + 1)); continue
            fi
            if [ "$CONFIRM" != archive ]; then
              echo "would run: tessl plugin archive --plugin testland/$name"; continue
            fi
            # stdin is the list file, so keep any prompt from reading it.
            if out=$(tessl plugin archive --plugin "testland/$name" --reason "$REASON" < /dev/null 2>&1); then
              echo "$out"; archived=$((archived + 1))
            else
              echo "$out"; failed=$((failed + 1)); echo "$name" >> /tmp/archive-failures.txt
              echo "::warning::archive failed for $name"
            fi
          done < .github/tessl-stale-tiles.txt
          echo "Listed $total; archived $archived; skipped $skipped; failed $failed"
          if [ "$failed" -gt 0 ]; then echo "::error::$failed tile(s) failed:"; cat /tmp/archive-failures.txt; exit 1; fi
