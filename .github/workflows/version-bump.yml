name: enforce-version-bump

# A plugin whose shipped files change must bump its plugin.json `version`, or
# installed users never receive the update (Claude Code caches by version).
# Runs on PRs AND direct pushes to main — direct-to-main must not bypass it.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Require plugin.json version bump for touched plugins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compare plugin.json versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -e
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$PUSH_AFTER_SHA"
            # First push to a new branch (all-zero before) or a base not in
            # history: nothing to compare against, so skip.
            if ! git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
              echo "No valid base commit ($BASE_SHA); nothing to enforce."
              exit 0
            fi
          fi
          touched=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -oE '^plugins/[^/]+' | sort -u || true)
          if [ -z "$touched" ]; then
            echo "No plugin files touched; nothing to enforce."
            exit 0
          fi
          fail=0
          for plugin in $touched; do
            manifest="$plugin/.claude-plugin/plugin.json"
            if [ ! -f "$manifest" ]; then
              continue
            fi
            before=$(git show "$BASE_SHA:$manifest" 2>/dev/null | jq -r .version 2>/dev/null || echo "MISSING")
            after=$(jq -r .version "$manifest")
            if [ "$before" = "MISSING" ]; then
              echo "::notice file=$manifest::new plugin (no base version); skipping bump check"
              continue
            fi
            if [ "$before" = "$after" ]; then
              echo "::error file=$manifest::version not bumped (still $before). Please bump $manifest version when changing files inside $plugin."
              fail=1
            else
              echo "OK: $plugin $before -> $after"
            fi
          done
          exit $fail
