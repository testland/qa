name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run validate.sh harness test
        run: bash scripts/test-validate.sh

      - name: Run validate.sh on plugins
        run: bash scripts/validate.sh .

      - name: Run rating-check.sh
        run: bash scripts/rating-check.sh .

      - name: Validate marketplace.json syntax
        run: python3 -c "import json; json.load(open('.claude-plugin/marketplace.json'))"

      - name: Validate composition graph (agent -> skill preloads)
        run: python3 scripts/composition-graph.py

      - name: Regenerate CATALOG.md and check for drift
        run: |
          python3 scripts/generate-catalog.py
          git diff --exit-code CATALOG.md

      - name: Content audit (description / body length + Windows-path hygiene)
        run: python3 scripts/content-audit.py --strict
