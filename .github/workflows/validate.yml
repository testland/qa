name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install tooling
        run: npm ci

      - name: Type-check tooling
        run: npm run typecheck

      - name: Tooling unit tests (includes the validate fixture harness)
        run: npm test

      - name: Run validate on plugins
        run: npm run validate

      - name: Validate marketplace.json syntax
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/marketplace.json','utf8'))"

      - name: Validate composition graph (agent -> skill preloads)
        run: npm run compose

      - name: Regenerate CATALOG.md and check for drift
        run: |
          npm run catalog
          git diff --exit-code CATALOG.md

      - name: Check eval manifests are in sync with their scenarios
        run: npm run evals:check

      - name: Content audit (description / body length + Windows-path hygiene)
        run: npm run audit

      - name: Check plugin.json description count drift
        run: npm run drift
